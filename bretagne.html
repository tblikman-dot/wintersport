<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏖️ Vakantiechecklist Bretagne</title>
  <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e7f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DIJK SKI">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    main { margin: 16px; padding-bottom: 40px; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      line-height: 1.7;
    }

    /* ===== SYNC STATUS ===== */
    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 50px;
      float: right;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .sync-status.live .sync-dot { background: #43a047; }
    .sync-status.live { color: #43a047; }
    .sync-status.offline .sync-dot { background: #ff9800; }
    .sync-status.offline { color: #ff9800; }
    .sync-status.error .sync-dot { background: #e53935; }
    .sync-status.error { color: #e53935; }

    /* ===== PROGRESS ===== */
    .progress-wrap {
      background: #eee;
      border-radius: 50px;
      height: 12px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #1e7f5c, #43a047);
      border-radius: 50px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .progress-label {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
    }

    /* ===== CATEGORIE ===== */
    .cat-card { padding: 14px 20px; }
    .cat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 4px 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .cat-head h2 {
      margin: 0;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-count {
      background: #e0e0e0;
      color: #666;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
      flex-shrink: 0;
    }
    .cat-count.done { background: #c8e6c9; color: #1b5e20; }
    .cat-chevron {
      transition: transform 0.2s;
      color: #bbb;
      font-size: 14px;
      margin-left: 8px;
    }
    .cat-card.collapsed .cat-chevron { transform: rotate(-90deg); }
    .cat-list {
      overflow: hidden;
      max-height: 2000px;
      transition: max-height 0.3s ease;
    }
    .cat-card.collapsed .cat-list { max-height: 0; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 2px;
      border-top: 1px solid #f0f0f0;
    }
    .item:first-child { border-top: none; }
    .item .ck {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s;
    }
    .item .ck:active { transform: scale(0.9); }
    .item.done .ck { background: #43a047; border-color: #43a047; color: #fff; }
    .item .naam { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: #333; }
    .item.done .naam { text-decoration: line-through; color: #aaa; }

    .acties {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .actie {
      flex: 1;
      min-width: 90px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 50px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      text-align: center;
    }
    .actie:active { background: #f5f5f5; transform: scale(0.97); }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 10000;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header class="app-header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <img src="logo-dijk-soft.png" alt="DIJK" class="app-logo">
</header>

<nav id="sideMenu" class="side-menu">
  <a href="index.html">🏠 Home</a>
  <a href="verblijf.html">🏡 Verblijf</a>
  <a href="meenemen.html">🎒 Meenemen</a>
  <a href="onderweg.html">🚗 Onderweg</a>
  <a href="ski.html">🎿 Ski</a>
  <a href="boodschappen.html">🛒 Boodschappen</a>
  <a href="bretagne.html">🏖️ Bretagne</a>
  <a href="fotos.html">📸 Foto's</a>
  <a href="bingo.html">🎲 Bingo</a>
  <a href="sos.html">🚨 SOS</a>
</nav>

<div id="menuOverlay" onclick="toggleMenu()"></div>

<main>

  <!-- TITEL -->
  <div class="card">
    <h1>🏖️ Vakantiechecklist Bretagne</h1>
    <p>Vink samen af wat al geregeld of ingepakt is. Wijzigingen worden direct gedeeld.</p>
    <div id="syncStatus" class="sync-status offline">
      <span class="sync-dot"></span>
      <span id="syncLabel">Verbinden…</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <!-- CATEGORIEEN -->
  <div id="categories"></div>

  <div class="card acties">
    <button class="actie" onclick="alleUitklappen()">↕️ Alles in-/uitklappen</button>
    <button class="actie" onclick="wisAlles()">🧹 Reset alles</button>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
function toggleMenu(){
  document.getElementById('sideMenu').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('show');
}

// ===== DATA (uit Vakantiechecklist Bretagne.xlsx) =====
const categories = [
  { id:'vertrek', icon:'🚪', label:'Vertrekcheck', items:[
    'Paspoorten/ID-kaarten','Bankpassen','Rijbewijs','Campingreservering','Huissleutels',
    'Autosleutels','Reservesleutel huis laten bijmaken','Water afsluiten','Stroom controleren',
    'Planten water / watergeefsysteem','Container regelen met buurvrouw','Koelkast leeg',
    'Vuilnis weg','Ramen/deuren dicht'
  ]},
  { id:'auto', icon:'🚗', label:'Auto', items:[
    'Motorolie controleren','1 L Kroon-Oil Torsynth VAG 5W-30 meenemen','Ruitensproeiervloeistof bijvullen',
    'Oplaadkabels auto','Zonnebrillen','Multifunctioneel zakmes onder bijrijdersstoel'
  ]},
  { id:'keuken', icon:'🍳', label:'Keuken', items:[
    'Omnia oven','Siliconen vorm','Bakpapier','French press','Keukenweegschaal','Koksmes',
    'Schilmes','Microplane','Keukenschaar','Koekenpannen','Kruiden','Koffiemelk','Theedoeken',
    'Keukenhanddoeken','Afwasmiddel','Spons','Vuilniszakken','Toiletpapier','Keukenrol','Microvezeldoekjes'
  ]},
  { id:'strand', icon:'🏖️', label:'Strand & buiten', items:[
    'Parasol','Parasolvoet','Beach shelter','Strandkleed','2 strandstoelen','Bolderkar',
    'Kinderdrager','SUP-set compleet','Drybag','Strandtennis-set','Kubb','Voetbal','Frisbee',
    'Visnetjes','Emmers/schepjes','4 loeppotjes','2 Micro-steps'
  ]},
  { id:'elektronica', icon:'🔌', label:'Elektronica', items:[
    'iPad','iPad-oplader','Telefoons','Telefoonopladers','Laptop','Laptopoplader','Muis',
    'Powerbank','Verlengsnoer','Verdeelstekker','Nachtlampjes'
  ]},
  { id:'speelgoed', icon:'🧸', label:'Speelgoed', items:[
    'Kapla','Playmobil','Boeken','Knuffels','Kleurboeken','Kleurpotloden','Stiften','Knutselspullen'
  ]},
  { id:'beddengoed', icon:'🛏️', label:'Beddengoed', items:[
    '2-persoons hoeslaken 140x190','2-persoons dekbedovertrek','2 kussenslopen',
    '2x 1-persoons hoeslaken 90x190','2x 1-persoons dekbedovertrek','2 kussenslopen (eenpersoons)',
    'Campingbedje + matras','Beddengoed campingbedje','10 handdoeken','5 badlakens'
  ]},
  { id:'kopen', icon:'🛍️', label:'Nog kopen', items:[
    '2 waterdichte telefoonhoesjes','2 opblaasbare bodyboards','Reservesleutel huis'
  ]},
];

// stabiele ids per item: catId-index
categories.forEach(c => { c.itemIds = c.items.map((_,i) => c.id+'-'+i); });

let state = {};       // { itemId: true/false }
let collapsed = {};   // { catId: true/false }
let fbRef = null;
let fbConnected = false;

// ===== FIREBASE CONFIG (zelfde project als Boodschappen) =====
const FIREBASE_CONFIG = {
  databaseURL: 'https://dijkski-default-rtdb.europe-west1.firebasedatabase.app'
};

function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    fbRef = db.ref('bretagneChecklist');

    db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) { fbConnected = true; setSyncStatus('live', 'Live sync'); }
      else { fbConnected = false; setSyncStatus('offline', 'Offline'); }
    });

    fbRef.on('value', snap => {
      const data = snap.val();
      state = data || {};
      saveLocal();
      render();
    });
  } catch(e) {
    console.error('Firebase fout:', e);
    setSyncStatus('error', 'Fout');
    loadLocal();
    render();
  }
}

function setSyncStatus(status, label) {
  const el = document.getElementById('syncStatus');
  const lbl = document.getElementById('syncLabel');
  el.className = 'sync-status ' + status;
  lbl.textContent = label;
}

// ===== OPSLAG =====
function loadLocal() {
  try { const s = localStorage.getItem('dijkBretagne'); if (s) state = JSON.parse(s); } catch(e) {}
  try { const s = localStorage.getItem('dijkBretagneCollapsed'); if (s) collapsed = JSON.parse(s); } catch(e) {}
}
function saveLocal() {
  try { localStorage.setItem('dijkBretagne', JSON.stringify(state)); } catch(e) {}
}
function saveCollapsedLocal() {
  try { localStorage.setItem('dijkBretagneCollapsed', JSON.stringify(collapsed)); } catch(e) {}
}

function save() {
  saveLocal();
  if (fbRef && fbConnected) {
    fbRef.set(state).catch(e => {
      console.error('Firebase write error:', e);
      setSyncStatus('error', 'Schrijffout');
    });
  }
}

// ===== RENDER =====
function render() {
  const el = document.getElementById('categories');

  let totalDone = 0, totalAll = 0;
  let h = '';

  categories.forEach(cat => {
    const done = cat.itemIds.filter(id => state[id]).length;
    const all = cat.itemIds.length;
    totalDone += done; totalAll += all;
    const isCollapsed = !!collapsed[cat.id];

    h += `<div class="card cat-card${isCollapsed?' collapsed':''}" id="cat-${cat.id}">
      <div class="cat-head" onclick="toggleCat('${cat.id}')">
        <h2>${cat.icon} ${cat.label}</h2>
        <div style="display:flex;align-items:center;">
          <span class="cat-count${done===all?' done':''}">${done}/${all}</span>
          <span class="cat-chevron">▾</span>
        </div>
      </div>
      <div class="cat-list">`;

    cat.items.forEach((name, i) => {
      const id = cat.itemIds[i];
      const isDone = !!state[id];
      h += `<div class="item${isDone?' done':''}" onclick="toggle('${id}')">
        <div class="ck">${isDone?'✓':''}</div>
        <div class="naam">${esc(name)}</div>
      </div>`;
    });

    h += `</div></div>`;
  });

  el.innerHTML = h;

  const pct = totalAll ? Math.round((totalDone/totalAll)*100) : 0;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('progressLabel').textContent =
    totalDone+' van '+totalAll+' items klaar ('+pct+'%)';
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== ACTIES =====
function toggle(id){
  state[id] = !state[id];
  save();
  render();
}

function toggleCat(catId){
  collapsed[catId] = !collapsed[catId];
  saveCollapsedLocal();
  document.getElementById('cat-'+catId).classList.toggle('collapsed');
}

function alleUitklappen(){
  const anyOpen = categories.some(c => !collapsed[c.id]);
  categories.forEach(c => { collapsed[c.id] = anyOpen; });
  saveCollapsedLocal();
  render();
}

function wisAlles(){
  if(confirm('Alle vinkjes van de Bretagne-checklist wissen?')){
    state = {};
    save();
    render();
    toast('🧹 Checklist gereset');
  }
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ===== INIT =====
loadLocal();
render();
initFirebase();
</script>

</body>
</html>
