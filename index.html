<style>
/* ===== COUNTDOWN BADGE TOP-RIGHT ===== */
.countdown-badge {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1a1a2e;
  color: #fff;
  padding: 6px 14px;
  border-radius: 50px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  user-select: none;
  transition: transform 0.2s ease;
}
.countdown-badge:active {
  transform: scale(0.95);
}
.countdown-badge .cd-number {
  font-size: 18px;
  font-weight: 800;
}
.countdown-badge .cd-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.85;
}
.countdown-badge.live {
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 2px 12px rgba(99,102,241,0.3); }
  50% { box-shadow: 0 2px 20px rgba(99,102,241,0.6); }
}

/* ===== FLOATING BUTTONS BOTTOM-RIGHT ===== */
.floating-sticker {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  width: 68px;
  height: 68px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.floating-sticker img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.floating-sticker:hover {
  transform: scale(1.12);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
.floating-sticker:active {
  transform: scale(0.96);
}

.floating-groceries {
  position: fixed;
  bottom: 24px;
  right: 100px;
  z-index: 9999;
  width: 68px;
  height: 68px;
  border-radius: 18px;
  background: linear-gradient(135deg, #43a047, #66bb6a);
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  line-height: 1.1;
  user-select: none;
}
.floating-groceries:hover {
  transform: scale(1.12);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
.floating-groceries:active {
  transform: scale(0.96);
}
.floating-groceries .fg-icon {
  font-size: 26px;
  line-height: 1;
}
.floating-groceries .fg-label {
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

/* ===== PISTE MAP BUTTON IN HEADER ===== */
.piste-btn {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.2);
  color: #fff;

  border-radius: 50px;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  border: 1.5px solid rgba(255,255,255,0.35);
  transition: all 0.15s;
  white-space: nowrap;
}
.piste-btn:hover { text-decoration: none; background: rgba(255,255,255,0.3); }
.piste-btn:active { transform: translateY(-50%) scale(0.95); }
.webcam-btn {
  left: 126px;
  background: rgba(255,255,255,0.15);

/* ===== SPOTIFY TILE ===== */
.tile-spotify {
  background: linear-gradient(135deg, #1DB954, #1ed760);
  color: #fff;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.tile-spotify:active {
  transform: scale(0.97);
}
.tile-spotify .sp-wave {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 30%;
  background: rgba(0,0,0,0.08);
  border-radius: 0 0 14px 14px;
}

/* ===== SPOTIFY EMBED SECTION ===== */
.spotify-section {
  margin: 0 16px 16px;
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  opacity: 0;
  border-radius: 16px;
}
.spotify-section.open {
  max-height: 400px;
  opacity: 1;
}
.spotify-section iframe {
  display: block;
  width: 100%;
  border-radius: 12px;
}
/* ===== LIVE FOTO FEED ===== */
.feed-section {
  margin: 0 16px 24px;
}
.feed-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.feed-title {
  font-size: 17px;
  font-weight: 800;
  color: #333;
  display: flex;
  align-items: center;
  gap: 6px;
}
.feed-live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #e53935;
  display: inline-block;
  animation: livePulse 1.5s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.feed-link {
  font-size: 13px;
  font-weight: 700;
  color: #1565C0;
  text-decoration: none;
}

.feed-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.feed-scroll::-webkit-scrollbar { display: none; }

.feed-card {
  flex-shrink: 0;
  width: 200px;
  scroll-snap-align: start;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  transition: transform 0.15s;
  cursor: pointer;
}
.feed-card:active { transform: scale(0.97); }
.feed-card img {
  width: 200px;
  height: 150px;
  object-fit: cover;
  display: block;
}
.feed-card-info {
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.feed-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 50px;
  font-size: 10px;
  font-weight: 700;
}
.feed-tag-haarlem   { background: #FFE0B2; color: #5D4037; }
.feed-tag-haren     { background: #B3E5FC; color: #01579B; }
.feed-tag-sanne     { background: #C8E6C9; color: #1B5E20; }
.feed-tag-zuidhorn  { background: #F8BBD0; color: #880E4F; }
.feed-tag-joure     { background: #D1C4E9; color: #311B92; }
.feed-time {
  font-size: 10px;
  color: #aaa;
}
.feed-reactions {
  padding: 2px 10px 8px;
  font-size: 12px;
  color: #999;
  display: flex;
  gap: 6px;
}
.feed-reactions span {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.feed-empty {
  width: 100%;
  text-align: center;
  padding: 24px 16px;
  color: #bbb;
  font-size: 14px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

@keyframes feedSlideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.feed-card { animation: feedSlideIn 0.3s ease both; }
</style>

<script>
const schema = {
  "2026-02-21": {ontbijt:null, avond:"Jan Jaap", schoonmaak:"Geessien & Tim"},
  "2026-02-22": {ontbijt:"Geessien & Tim", avond:"Sanne & Gert", schoonmaak:"Geessien & Tim"},
  "2026-02-23": {ontbijt:"Kim & Pieter", avond:"Koos & Jan", schoonmaak:"Kim & Pieter"},
  "2026-02-24": {ontbijt:"Jan Jaap", avond:"Geessien & Tim", schoonmaak:"Sanne & Gert"},
  "2026-02-25": {ontbijt:"Sanne & Gert", avond:"Uit eten", schoonmaak:"Jan Jaap"},
  "2026-02-26": {ontbijt:"Koos & Jan", avond:"Kim & Pieter", schoonmaak:"Koos & Jan"},
  "2026-02-27": {ontbijt:"Jan Jaap", avond:"Pizza afhalen", schoonmaak:"Allen"},
  "2026-02-28": {ontbijt:"Sanne & Gert", avond:null, schoonmaak:null}
};

const vandaag = new Date().toISOString().slice(0,10);
const inhoud = document.getElementById("vandaag-inhoud");

if (schema[vandaag]) {
  const d = schema[vandaag];
  inhoud.innerHTML = `
    ${d.ontbijt ? "🥐 Ontbijt: <strong>"+d.ontbijt+"</strong><br>" : ""}
    ${d.avond ? "🍽️ Avondeten: <strong>"+d.avond+"</strong><br>" : ""}
    ${d.schoonmaak ? "🧽 Schoonmaak: <strong>"+d.schoonmaak+"</strong>" : ""}
  `;
} else {
  inhoud.textContent = "Geen rooster voor vandaag.";
}
</script>

<script>

  const sec = document.getElementById('spotifySection');
  const frame = document.getElementById('spotifyFrame');
  sec.classList.toggle('open');
  // Lazy-load iframe alleen bij eerste open
  if (!frame.src) {
    frame.src = 'https://open.spotify.com/embed/playlist/4UEajBJjXLcphtkw3zyFQC?utm_source=generator';
  }
  if (sec.classList.contains('open')) {
    setTimeout(() => sec.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
  }
}
</script>

<script>
(function(){
  const btn   = document.getElementById('countdownBadge');
  const num   = document.getElementById('cdNumber');
  const lbl   = document.getElementById('cdLabel');

  const now      = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startMid = new Date(2026, 1, 21);
  const endMid   = new Date(2026, 1, 28);

  if (todayMid < startMid) {
    const diff = Math.ceil((startMid - todayMid) / (1000*60*60*24));
    num.textContent = diff;
    lbl.textContent = diff === 1 ? 'nog 1 dag' : 'nog ' + diff + ' dgn';
  } else if (todayMid >= startMid && todayMid <= endMid) {
    const dag = Math.floor((todayMid - startMid) / (1000*60*60*24)) + 1;
    num.textContent = dag;
    lbl.textContent = 'dag ' + dag + ' 🎿';
    btn.classList.add('live');
  } else {
    num.textContent = '✓';
    lbl.textContent = 'voorbij';
  }
})();
</script>

<script>
// ===== LIVE FOTO FEED =====
(function(){
  const FIREBASE_CONFIG = {
    databaseURL: 'https://dijkski-default-rtdb.europe-west1.firebasedatabase.app'
  };

  const feedFams = [
    { id:'haarlem',  short:'Jan Jaap' },
    { id:'haren',    short:'Tim & Geessien' },
    { id:'sanne',    short:'Sanne & Gert' },
    { id:'zuidhorn', short:'Kim & Pieter' },
    { id:'joure',    short:'Koos & Jan Dirk' },
  ];

  try {
    // Check of Firebase al geïnitialiseerd is
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const db = firebase.database();
    const fbFotos = db.ref('fotos');
    const fbReacties = db.ref('reacties');
    let allReactions = {};

    // Luister naar reacties
    fbReacties.on('value', snap => {
      allReactions = snap.val() || {};
    });

    // Luister naar laatste 10 foto's
    fbFotos.orderByChild('ts').limitToLast(10).on('value', snap => {
      const data = snap.val();
      let photos = data ? Object.values(data) : [];
      photos.sort((a,b) => b.ts - a.ts);

      const container = document.getElementById('feedScroll');

      if (photos.length === 0) {
        container.innerHTML = '<div class="feed-empty">📷 Nog geen foto\'s gedeeld.<br><a href="fotos.html" style="color:#1565C0;font-weight:700;">Maak de eerste!</a></div>';
        return;
      }

      container.innerHTML = photos.map((p, idx) => {
        const fam = feedFams.find(f => f.id === p.fam);
        const time = timeAgo(p.ts);

        // Gather reactions for this photo
        const pr = allReactions[p.id] || {};
        let reactStr = '';
        ['❄️','🔥','🎿','😂','❤️'].forEach(emoji => {
          const cnt = pr[emoji] ? Object.keys(pr[emoji]).length : 0;
          if (cnt > 0) reactStr += `<span>${emoji} ${cnt}</span>`;
        });

        return `<a href="fotos.html" class="feed-card" style="animation-delay:${idx*0.06}s; text-decoration:none; color:inherit;">
          <img src="${p.data}" alt="Foto" loading="lazy">
          <div class="feed-card-info">
            <span class="feed-tag feed-tag-${p.fam}">${fam ? fam.short : '?'}</span>
            <span class="feed-time">${time}</span>
          </div>
          ${reactStr ? `<div class="feed-reactions">${reactStr}</div>` : ''}
        </a>`;
      }).join('');
    });

  } catch(e) {
    console.log('Feed: Firebase niet beschikbaar', e);
    document.getElementById('feedScroll').innerHTML = '<div class="feed-empty">📷 <a href="fotos.html" style="color:#1565C0;font-weight:700;">Bekijk foto\'s →</a></div>';
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return 'zojuist';
    if (diff < 3600) return Math.floor(diff/60) + ' min';
    if (diff < 86400) return Math.floor(diff/3600) + ' uur';
    return Math.floor(diff/86400) + ' dag' + (Math.floor(diff/86400) !== 1 ? 'en' : '');
  }
})();
</script>
