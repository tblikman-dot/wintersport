<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>DIJK Skifestijn 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
/* ===== COUNTDOWN BADGE TOP-RIGHT ===== */
.countdown-badge {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1a1a2e;
  color: #fff;
  padding: 6px 14px;
  border-radius: 50px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  user-select: none;
  transition: transform 0.2s ease;
}
.countdown-badge:active {
  transform: scale(0.95);
}
.countdown-badge .cd-number {
  font-size: 18px;
  font-weight: 800;
}
.countdown-badge .cd-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.85;
}
.countdown-badge.live {
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 2px 12px rgba(99,102,241,0.3); }
  50% { box-shadow: 0 2px 20px rgba(99,102,241,0.6); }
}

/* ===== FLOATING BUTTONS BOTTOM-RIGHT ===== */
.floating-sticker {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  width: 68px;
  height: 68px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.floating-sticker img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.floating-sticker:hover {
  transform: scale(1.12);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
.floating-sticker:active {
  transform: scale(0.96);
}

.floating-groceries {
  position: fixed;
  bottom: 24px;
  right: 100px;
  z-index: 9999;
  width: 68px;
  height: 68px;
  border-radius: 18px;
  background: linear-gradient(135deg, #43a047, #66bb6a);
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  line-height: 1.1;
  user-select: none;
}
.floating-groceries:hover {
  transform: scale(1.12);
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
.floating-groceries:active {
  transform: scale(0.96);
}
.floating-groceries .fg-icon {
  font-size: 26px;
  line-height: 1;
}
.floating-groceries .fg-label {
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}
</style>
</head>
<body>

<!-- COUNTDOWN BADGE TOP-RIGHT -->
<div class="countdown-badge" id="countdownBadge">
  <span class="cd-number" id="cdNumber">…</span>
  <span class="cd-label" id="cdLabel"></span>
</div>

<!-- FLOATING BUTTONS BOTTOM-RIGHT -->
<a href="https://app.wiebetaaltwat.nl/list_invitations/U-xA--NLV8LYT48WC_Sz?lang=nl" target="_blank" class="floating-sticker" id="wbwSticker">
  <img src="wbw.png" alt="WBW">
</a>

<a href="boodschappen.html" class="floating-groceries">
  <span class="fg-icon">🛒</span>
  <span class="fg-label">Lijst</span>
</a>

<header class="app-header no-logo">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <img src="logo-dijk-soft.png" alt="DIJK" class="app-logo">
</header>

<nav id="sideMenu" class="side-menu">

<header class="header">

<section class="hero">
  <img src="ai.jpg" alt="Skiplezier" class="hero-image">

<main class="tiles">
  <a class="tile" href="verblijf.html">🏠 Verblijf</a>

  <a class="tile" href="boodschappen.html">🛒 Boodschappen</a>
  <a class="tile" href="bingo.html">🎲 Bingo</a>
  <a class="tile" href="sos.html">🚨 SOS</a>
</main>

<script>
const schema = {
  "2026-02-21": {ontbijt:null, avond:"Jan Jaap", schoonmaak:"Geessien & Tim"},
  "2026-02-22": {ontbijt:"Geessien & Tim", avond:"Sanne & Gert", schoonmaak:"Geessien & Tim"},
  "2026-02-23": {ontbijt:"Kim & Pieter", avond:"Koos & Jan", schoonmaak:"Kim & Pieter"},
  "2026-02-24": {ontbijt:"Jan Jaap", avond:"Geessien & Tim", schoonmaak:"Sanne & Gert"},
  "2026-02-25": {ontbijt:"Sanne & Gert", avond:"Uit eten", schoonmaak:"Jan Jaap"},
  "2026-02-26": {ontbijt:"Koos & Jan", avond:"Kim & Pieter", schoonmaak:"Koos & Jan"},
  "2026-02-27": {ontbijt:"Jan Jaap", avond:"Pizza afhalen", schoonmaak:"Allen"},
  "2026-02-28": {ontbijt:"Sanne & Gert", avond:null, schoonmaak:null}
};

const vandaag = new Date().toISOString().slice(0,10);
const inhoud = document.getElementById("vandaag-inhoud");

if (schema[vandaag]) {
  const d = schema[vandaag];
  inhoud.innerHTML = `
    ${d.ontbijt ? "🥐 Ontbijt: <strong>"+d.ontbijt+"</strong><br>" : ""}
    ${d.avond ? "🍽️ Avondeten: <strong>"+d.avond+"</strong><br>" : ""}
    ${d.schoonmaak ? "🧽 Schoonmaak: <strong>"+d.schoonmaak+"</strong>" : ""}
  `;
} else {
  inhoud.textContent = "Geen rooster voor vandaag.";
}
</script>

<script>
function toggleMenu(){
  document.getElementById('sideMenu').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('show');
}
</script>

<script>
(function(){
  const btn   = document.getElementById('countdownBadge');
  const num   = document.getElementById('cdNumber');
  const lbl   = document.getElementById('cdLabel');

  const now      = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startMid = new Date(2026, 1, 21);
  const endMid   = new Date(2026, 1, 28);

  if (todayMid < startMid) {
    const diff = Math.ceil((startMid - todayMid) / (1000*60*60*24));
    num.textContent = diff;
    lbl.textContent = diff === 1 ? 'nog 1 dag' : 'nog ' + diff + ' dgn';
  } else if (todayMid >= startMid && todayMid <= endMid) {
    const dag = Math.floor((todayMid - startMid) / (1000*60*60*24)) + 1;
    num.textContent = dag;
    lbl.textContent = 'dag ' + dag + ' 🎿';
    btn.classList.add('live');
  } else {
    num.textContent = '✓';
    lbl.textContent = 'voorbij';
  }
})();
</script>

</body>
</html>
