<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>DIJK 2026 — Kies je reis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e7f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DIJK SKI">
<link rel="stylesheet" href="style.css">

<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .chooser-header {
    text-align: center;
    padding: 36px 16px 8px;
  }
  .chooser-logo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .chooser-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: #1e3d2b;
    margin-top: 14px;
  }
  .chooser-sub {
    font-size: 0.95rem;
    color: #667;
    opacity: 0.75;
    margin-top: 4px;
  }

  .chooser-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    padding: 24px 20px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  .trip-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    padding: 32px 20px;
    border-radius: 24px;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .trip-card:hover { text-decoration: none; }
  .trip-card:active { transform: scale(0.97); }

  .trip-ski {
    background: linear-gradient(135deg, #1e7f5c 0%, #16a34a 55%, #4ade80 100%);
  }
  .trip-bretagne {
    background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 55%, #7dd3fc 100%);
  }

  .trip-emoji { font-size: 3rem; line-height: 1; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.2)); }
  .trip-name { font-size: 1.3rem; font-weight: 800; margin-top: 4px; }
  .trip-date { font-size: 0.82rem; font-weight: 600; opacity: 0.85; }
  .trip-status {
    margin-top: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(255,255,255,0.2);
    padding: 3px 12px;
    border-radius: 50px;
  }

  .chooser-footer {
    text-align: center;
    padding: 8px 16px 32px;
    font-size: 0.85rem;
  }
  .chooser-footer a {
    color: #667;
    text-decoration: none;
    font-weight: 600;
    margin: 0 10px;
  }
  .chooser-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="chooser-header">
  <img src="logo-dijk-soft.png" alt="DIJK" class="chooser-logo">
  <div class="chooser-title">Welkom bij DIJK 2026</div>
  <div class="chooser-sub">Kies je reis</div>
</div>

<main class="chooser-main">
  <a href="wintersport.html" class="trip-card trip-ski">
    <span class="trip-emoji">🎿</span>
    <span class="trip-name">Wintersport</span>
    <span class="trip-date">Hochkrimml · 21–28 februari 2026</span>
    <span class="trip-status" id="skiStatus">…</span>
  </a>

  <a href="bretagne-home.html" class="trip-card trip-bretagne">
    <span class="trip-emoji">🏖️</span>
    <span class="trip-name">Bretagne</span>
    <span class="trip-date">Zomervakantie 2026</span>
    <span class="trip-status">binnenkort</span>
  </a>
</main>

<div class="chooser-footer">
  <a href="fotos.html">📸 Foto's</a>·<a href="videos.html">🎬 Video's</a>·<a href="sos.html">🚨 SOS</a>
</div>

<script>
(function(){
  const el = document.getElementById('skiStatus');
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = new Date(2026, 1, 21);
  const end = new Date(2026, 1, 28);
  if (todayMid < start) el.textContent = 'nog te gaan';
  else if (todayMid <= end) el.textContent = 'nu bezig 🎿';
  else el.textContent = 'terugblik';
})();
</script>

</body>
</html>
